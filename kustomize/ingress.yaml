apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snakes-and-ladders
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kace-in-lestve.ostro.si
      secretName: snakes-and-ladders-tls
  rules:
    - host: kace-in-lestve.ostro.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: snakes-and-ladders
                port:
                  number: 80
